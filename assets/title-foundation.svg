<text class="m" x="40" y="32" font-size="12" letter-spacing="3" fill="#C77B9B">02 / EXPERIENCE &amp; FOUNDATION</text><text class="s" x="38" y="82" font-size="43" fill="#F8F0F3">The foundation behind the work.</text><text class="m" x="1160" y="32" text-anchor="end" font-size="11" letter-spacing="2" fill="#B6A3AC">SUPPORT → SYSTEMS → CLOUD</text><path class="line" d="M40 105H1160" stroke="url(#l)" stroke-width="1.2"/><style>.fx-header-motion{pointer-events:none}@media(prefers-reduced-motion:reduce){.fx-header-motion{display:none}}</style>
