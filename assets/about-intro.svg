<g class="in"><text class="mono" x="48" y="48" fill="#60A5FA" font-size="12" letter-spacing="2.5">PROFILE / 01</text><text class="serif" x="48" y="100" fill="#F4F8FF" font-size="31">Systems-minded. Cloud-focused.</text><text class="sans" x="48" y="131" fill="#C4D2E8" font-size="17">Building repeatable infrastructure and learning through hands-on labs.</text></g>
<g class="in d1"><rect x="48" y="164" width="690" height="183" rx="14" fill="#090E1F" stroke="#1E3A8A"/><circle cx="70" cy="188" r="4" fill="#FB7185"/><circle cx="84" cy="188" r="4" fill="#FBBF24"/><circle cx="98" cy="188" r="4" fill="#34D399"/><text class="mono" x="118" y="193" fill="#C4D2E8" font-size="12">sameed@cloud-lab:~$ profile</text>
<text class="mono" x="70" y="228" fill="#7DD3FC" font-size="15">$ focus --infrastructure</text><text class="sans" x="70" y="251" fill="#F4F8FF" font-size="15">AWS networking + Terraform IaC</text>
<text class="mono" x="70" y="280" fill="#7DD3FC" font-size="15">$ automate --delivery</text><text class="sans" x="70" y="303" fill="#F4F8FF" font-size="15">Jenkins pipelines + Maven build checks</text>
<text class="mono" x="70" y="330" fill="#7DD3FC" font-size="15">$ observe --systems</text><text class="sans" x="320" y="330" fill="#F4F8FF" font-size="15">Prometheus · Grafana · Splunk</text></g>
<g class="in d2"><rect x="770" y="164" width="382" height="183" rx="14" fill="#10162B" stroke="#60A5FA" stroke-opacity=".35"/><text class="mono" x="796" y="194" fill="#60A5FA" font-size="12" letter-spacing="1.5">WHAT I BRING</text>
<circle cx="800" cy="222" r="4" fill="#7DD3FC"/><text class="sans" x="817" y="227" fill="#F4F8FF" font-size="15">Network troubleshooting</text>
<circle cx="800" cy="254" r="4" fill="#7DD3FC"/><text class="sans" x="817" y="259" fill="#F4F8FF" font-size="15">Windows + Linux administration</text>
<circle cx="800" cy="286" r="4" fill="#7DD3FC"/><text class="sans" x="817" y="291" fill="#F4F8FF" font-size="15">Infrastructure as Code</text>
<circle cx="800" cy="318" r="4" fill="#7DD3FC"/><text class="sans" x="817" y="323" fill="#F4F8FF" font-size="15">Monitoring and incident diagnosis</text></g>
<text class="mono" x="48" y="378" fill="#91A4C6" font-size="11">BENGALURU, INDIA · BCA · CLOUD COMPUTING TRAINING</text>

  <style>
    .fx-motion { pointer-events:none; }
    @media (prefers-reduced-motion: reduce) { .fx-motion { display:none; } }
