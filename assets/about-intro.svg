<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="t d">
<title id="t">About Sameed Khan</title><desc id="d">Systems and networking professional in Bengaluru building AWS DevOps skills through Terraform infrastructure, Jenkins pipelines and Prometheus and Grafana monitoring.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10162B"/><stop offset="1" stop-color="#090E1F"/></linearGradient><radialGradient id="glow"><stop stop-color="#4F46E5" stop-opacity=".65"/><stop offset="1" stop-color="#10162B" stop-opacity="0"/></radialGradient><linearGradient id="stroke"><stop stop-color="#60A5FA"/><stop offset="1" stop-color="#1E3A8A"/></linearGradient>
  <linearGradient id="fx-sheen" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#7DD3FC" stop-opacity="0"/>
    <stop offset=".48" stop-color="#7DD3FC" stop-opacity=".20"/>
    <stop offset="1" stop-color="#7DD3FC" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="fx-panel-clip"><rect x="0" y="0" width="1200" height="400" rx="20"/></clipPath>
  <filter id="fx-panel-glow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="1.8" result="glow"/>
    <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<style>.mono{font-family:ui-monospace,Consolas,monospace}.sans{font-family:Arial,Helvetica,sans-serif}.serif{font-family:Georgia,'Times New Roman',serif}@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.in{animation:fade .8s ease both}.d1{animation-delay:.1s}.d2{animation-delay:.25s}.d3{animation-delay:.4s}.d4{animation-delay:.55s}@media(prefers-reduced-motion:reduce){.in{animation:none}}</style>
