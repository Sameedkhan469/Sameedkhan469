<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="1200" height="350" role="img" aria-label="Professional experience and education of Sameed Khan">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10162B"/><stop offset="1" stop-color="#090E1F"/></linearGradient><linearGradient id="accent" x1="0" x2="1"><stop stop-color="#60A5FA"/><stop offset="1" stop-color="#4F46E5"/></linearGradient>
  <linearGradient id="fx-sheen" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#7DD3FC" stop-opacity="0"/>
    <stop offset=".48" stop-color="#7DD3FC" stop-opacity=".20"/>
    <stop offset="1" stop-color="#7DD3FC" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="fx-panel-clip"><rect x="0" y="0" width="1200" height="350" rx="20"/></clipPath>
  <filter id="fx-panel-glow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="1.8" result="glow"/>
    <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs><style>.m{font-family:ui-monospace,Consolas,monospace}.s{font-family:Arial,Helvetica,sans-serif}.serif{font-family:Georgia,'Times New Roman',serif}</style>
<rect width="1200" height="350" rx="20" fill="url(#bg)" stroke="#60A5FA" stroke-opacity=".28"/>
<text class="m" x="36" y="38" fill="#60A5FA" font-size="12" letter-spacing="2">CAREER TIMELINE</text>
<path d="M78 88V268" stroke="url(#accent)" stroke-width="2"/>
<circle cx="78" cy="96" r="8" fill="#7DD3FC"/><circle cx="78" cy="178" r="8" fill="#60A5FA"/><circle cx="78" cy="260" r="8" fill="#4F46E5" stroke="#7DD3FC"/>
<text class="s" x="108" y="93" fill="#F4F8FF" font-size="22" font-weight="700">Networking Engineer</text><text class="m" x="1160" y="93" fill="#60A5FA" font-size="12" text-anchor="end">8 MONTHS · F2TH COMMUNICATION</text><text class="s" x="108" y="119" fill="#C4D2E8" font-size="15">Connectivity, routing, IP addressing, DNS/DHCP and TCP/IP troubleshooting;</text><text class="s" x="108" y="141" fill="#C4D2E8" font-size="15">device configuration, monitoring and fault investigation.</text>
<text class="s" x="108" y="175" fill="#F4F8FF" font-size="22" font-weight="700">System Administrator</text><text class="m" x="1160" y="175" fill="#60A5FA" font-size="12" text-anchor="end">1 YEAR 6 MONTHS · DN COMPUTERS</text><text class="s" x="108" y="201" fill="#C4D2E8" font-size="15">Windows/Linux administration, user permissions, updates, backups,</text><text class="s" x="108" y="223" fill="#C4D2E8" font-size="15">file sharing, system maintenance and OS/hardware troubleshooting.</text>
<text class="s" x="108" y="257" fill="#F4F8FF" font-size="22" font-weight="700">Education &amp; cloud learning</text><text class="m" x="1160" y="257" fill="#60A5FA" font-size="12" text-anchor="end">BCA · CLOUD COMPUTING</text><text class="s" x="108" y="283" fill="#C4D2E8" font-size="15">Bachelor of Computer Applications, Arunodaya University (2021–2024).</text><text class="s" x="108" y="305" fill="#C4D2E8" font-size="15">Diploma in Cloud Computing, Jetking; AWS Solutions Architecture Job Simulation.</text>
<path d="M36 326H1164" stroke="#1E3A8A"/><text class="m" x="36" y="341" fill="#91A4C6" font-size="10">PRACTICAL BACKGROUND: USER ACCESS · NETWORK CONNECTIVITY · INFRASTRUCTURE SUPPORT</text>
  <style>
    .fx-motion { pointer-events:none; }
    @media (prefers-reduced-motion: reduce) { .fx-motion { display:none; } }
  </style>
  <g class="fx-motion" clip-path="url(#fx-panel-clip)" pointer-events="none">
    <rect x="-280" y="0" width="280" height="350" fill="url(#fx-sheen)" opacity=".62">
      <animate attributeName="x" values="-280;1200;1200" keyTimes="0;.72;1" dur="9.5s" begin="1.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="1.5" y="1.5" width="1197" height="347" rx="19" fill="none" stroke="#60A5FA" stroke-opacity=".54" stroke-width="1.15" stroke-dasharray="58 3100">
      <animate attributeName="stroke-dashoffset" values="0;-3100" dur="24s" repeatCount="indefinite"/>
    </rect>
    <circle r="2.2" fill="#F4F8FF" filter="url(#fx-panel-glow)">
      <animateMotion path="M 20 1 H 1180 Q 1199 1 1199 20 V 330 Q 1199 349 1180 349 H 20 Q 1 349 1 330 V 20 Q 1 1 20 1" dur="17s" begin=".8s" repeatCount="indefinite" rotate="auto"/>
      <animate attributeName="opacity" values=".15;1;.3;1;.15" dur="3.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>