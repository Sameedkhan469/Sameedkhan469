<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" width="1200" height="190" role="img" aria-label="Sameed Khan — Build, automate, monitor">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10162B"/><stop offset="1" stop-color="#090E1F"/></linearGradient><linearGradient id="accent" x1="0" x2="1"><stop stop-color="#60A5FA"/><stop offset="1" stop-color="#7DD3FC"/></linearGradient><linearGradient id="fx-sheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7DD3FC" stop-opacity="0"/><stop offset=".48" stop-color="#7DD3FC" stop-opacity=".20"/><stop offset="1" stop-color="#7DD3FC" stop-opacity="0"/></linearGradient><clipPath id="fx-panel-clip"><rect width="1200" height="190" rx="20"/></clipPath><filter id="fx-panel-glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="1.8" result="glow"/><feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>.m{font-family:ui-monospace,Consolas,monospace}.s{font-family:Georgia,'Times New Roman',serif}</style><rect width="1200" height="190" rx="20" fill="url(#bg)" stroke="#60A5FA" stroke-opacity=".28"/><path d="M40 128H1160" stroke="#1E3A8A"/><text class="m" x="40" y="42" fill="#60A5FA" font-size="11" letter-spacing="2.2">SAMEED KHAN / AWS DEVOPS</text><text class="s" x="40" y="89" fill="#F4F8FF" font-size="34">Build with intent. Automate the repeatable.</text><text class="s" x="40" y="119" fill="#7DD3FC" font-size="25" font-style="italic">Observe the result. Improve the system.</text><g transform="translate(40 152)"><text class="m" x="0" y="0" fill="#C4D2E8" font-size="12">INFRASTRUCTURE AS CODE</text><circle cx="225" cy="-4" r="3" fill="#60A5FA"/><text class="m" x="242" y="0" fill="#C4D2E8" font-size="12">CI/CD</text><circle cx="310" cy="-4" r="3" fill="#60A5FA"/><text class="m" x="327" y="0" fill="#C4D2E8" font-size="12">OBSERVABILITY</text><circle cx="480" cy="-4" r="3" fill="#60A5FA"/><text class="m" x="497" y="0" fill="#C4D2E8" font-size="12">NETWORKING</text></g><style>.fx-motion{pointer-events:none}@media(prefers-reduced-motion:reduce){.fx-motion{display:none}}</style><g class="fx-motion" clip-path="url(#fx-panel-clip)" pointer-events="none"><rect x="-280" y="0" width="280" height="190" fill="url(#fx-sheen)" opacity=".62"><animate attributeName="x" values="-280;1200;1200" keyTimes="0;.72;1" dur="9.5s" begin="1.1s" repeatCount="indefinite"/></rect><rect x="1.5" y="1.5" width="1197" height="187" rx="19" fill="none" stroke="#60A5FA" stroke-opacity=".54" stroke-width="1.15" stroke-dasharray="58 2780"><animate attributeName="stroke-dashoffset" values="0;-2780" dur="24s" repeatCount="indefinite"/></rect><circle r="2.2" fill="#F4F8FF" filter="url(#fx-panel-glow)"><animateMotion path="M 20 1 H 1180 Q 1199 1 1199 20 V 170 Q 1199 189 1180 189 H 20 Q 1 189 1 170 V 20 Q 1 1 20 1" dur="17s" begin=".8s" repeatCount="indefinite" rotate="auto"/><animate attributeName="opacity" values=".15;1;.3;1;.15" dur="3.8s" repeatCount="indefinite"/></circle></g></svg>