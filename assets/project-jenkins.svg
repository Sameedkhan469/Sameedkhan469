<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Jenkins CI/CD and Maven build pipelines">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10162B"/><stop offset="1" stop-color="#090E1F"/></linearGradient>
  <linearGradient id="fx-sheen" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#7DD3FC" stop-opacity="0"/>
    <stop offset=".48" stop-color="#7DD3FC" stop-opacity=".20"/>
    <stop offset="1" stop-color="#7DD3FC" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="fx-panel-clip"><rect x="0" y="0" width="1200" height="320" rx="20"/></clipPath>
  <filter id="fx-panel-glow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="1.8" result="glow"/>
    <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs><style>.m{font-family:ui-monospace,Consolas,monospace}.s{font-family:Arial,Helvetica,sans-serif}.serif{font-family:Georgia,'Times New Roman',serif}</style>
<rect width="1200" height="320" rx="20" fill="url(#bg)" stroke="#60A5FA" stroke-opacity=".32"/><text class="m" x="34" y="35" fill="#60A5FA" font-size="11" letter-spacing="2">PROJECT 04 / CI·CD AUTOMATION</text><text class="serif" x="34" y="78" fill="#F4F8FF" font-size="32">Jenkins + Maven pipelines</text><text class="s" x="34" y="106" fill="#C4D2E8" font-size="15">Two practice repos: Java build lifecycle and Terraform infrastructure checks.</text>
<text class="m" x="34" y="143" fill="#60A5FA" font-size="11" letter-spacing="1.2">JAVA / MAVEN PIPELINE</text>
<g transform="translate(34 158)"><rect width="176" height="62" rx="10" fill="#1E3A8A" stroke="#60A5FA"/><text class="s" x="88" y="27" fill="#F4F8FF" font-size="16" text-anchor="middle">Compile</text><text class="m" x="88" y="46" fill="#7DD3FC" font-size="10" text-anchor="middle">mvn compile</text></g><path d="M217 189h30m-8-7 8 7-8 7" stroke="#60A5FA" fill="none" stroke-width="2"/><g transform="translate(256 158)"><rect width="176" height="62" rx="10" fill="#10162B" stroke="#60A5FA"/><text class="s" x="88" y="27" fill="#F4F8FF" font-size="16" text-anchor="middle">Test</text><text class="m" x="88" y="46" fill="#7DD3FC" font-size="10" text-anchor="middle">mvn test</text></g><path d="M439 189h30m-8-7 8 7-8 7" stroke="#60A5FA" fill="none" stroke-width="2"/><g transform="translate(478 158)"><rect width="176" height="62" rx="10" fill="#10162B" stroke="#60A5FA"/><text class="s" x="88" y="27" fill="#F4F8FF" font-size="16" text-anchor="middle">Package</text><text class="m" x="88" y="46" fill="#7DD3FC" font-size="10" text-anchor="middle">archive JAR</text></g>
<text class="m" x="710" y="143" fill="#60A5FA" font-size="11" letter-spacing="1.2">TERRAFORM CHECKS PIPELINE</text>
<g transform="translate(710 158)"><rect width="102" height="62" rx="10" fill="#10162B" stroke="#60A5FA"/><text class="s" x="51" y="27" fill="#F4F8FF" font-size="13" text-anchor="middle">Init</text><text class="m" x="51" y="46" fill="#7DD3FC" font-size="9" text-anchor="middle">terraform</text></g><path d="M818 189h14m-7-7 7 7-7 7" stroke="#60A5FA" fill="none" stroke-width="2"/><g transform="translate(838 158)"><rect width="102" height="62" rx="10" fill="#10162B" stroke="#60A5FA"/><text class="s" x="51" y="27" fill="#F4F8FF" font-size="13" text-anchor="middle">Fmt</text><text class="m" x="51" y="46" fill="#7DD3FC" font-size="9" text-anchor="middle">fmt -check</text></g><path d="M946 189h14m-7-7 7 7-7 7" stroke="#60A5FA" fill="none" stroke-width="2"/><g transform="translate(966 158)"><rect width="102" height="62" rx="10" fill="#10162B" stroke="#60A5FA"/><text class="s" x="51" y="27" fill="#F4F8FF" font-size="13" text-anchor="middle">Validate</text><text class="m" x="51" y="46" fill="#7DD3FC" font-size="9" text-anchor="middle">validate</text></g><path d="M1074 189h14m-7-7 7 7-7 7" stroke="#60A5FA" fill="none" stroke-width="2"/><g transform="translate(1094 158)"><rect width="72" height="62" rx="10" fill="#1E3A8A" stroke="#60A5FA"/><text class="s" x="36" y="27" fill="#F4F8FF" font-size="13" text-anchor="middle">Plan</text><text class="m" x="36" y="46" fill="#7DD3FC" font-size="9" text-anchor="middle">plan</text></g>
<path d="M34 245H1166" stroke="#1E3A8A"/><text class="m" x="34" y="270" fill="#C4D2E8" font-size="12">GITHUB WEBHOOKS · JENKINSFILE · PIPELINE AS CODE · AWS EC2 · TERRAFORM</text><text class="s" x="34" y="295" fill="#91A4C6" font-size="12">Maven project packages a JAR; Terraform pipeline checks infrastructure code and produces a plan.</text>
  <style>
    .fx-motion { pointer-events:none; }
    @media (prefers-reduced-motion: reduce) { .fx-motion { display:none; } }
  </style>
  <g class="fx-motion" clip-path="url(#fx-panel-clip)" pointer-events="none">
    <rect x="-280" y="0" width="280" height="320" fill="url(#fx-sheen)" opacity=".62">
      <animate attributeName="x" values="-280;1200;1200" keyTimes="0;.72;1" dur="9.5s" begin="1.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="1.5" y="1.5" width="1197" height="317" rx="19" fill="none" stroke="#60A5FA" stroke-opacity=".54" stroke-width="1.15" stroke-dasharray="58 3040">
      <animate attributeName="stroke-dashoffset" values="0;-3040" dur="24s" repeatCount="indefinite"/>
    </rect>
    <circle r="2.2" fill="#F4F8FF" filter="url(#fx-panel-glow)">
      <animateMotion path="M 20 1 H 1180 Q 1199 1 1199 20 V 300 Q 1199 319 1180 319 H 20 Q 1 319 1 300 V 20 Q 1 1 20 1" dur="17s" begin=".8s" repeatCount="indefinite" rotate="auto"/>
      <animate attributeName="opacity" values=".15;1;.3;1;.15" dur="3.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>