<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" role="img" aria-labelledby="hero-title hero-desc">
<title id="hero-title">Sameed Khan — AWS DevOps and Networking</title>
<desc id="hero-desc">A burgundy terminal-inspired professional profile banner featuring cloud infrastructure, automation and observability motifs.</desc>
<defs>
  <linearGradient id="hero-bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#190B12"/><stop offset=".55" stop-color="#130810"/><stop offset="1" stop-color="#10070C"/></linearGradient>
  <radialGradient id="hero-glow" cx="78%" cy="28%" r="75%"><stop stop-color="#701A3D" stop-opacity=".65"/><stop offset="1" stop-color="#10070C" stop-opacity="0"/></radialGradient>
  <linearGradient id="hero-metal" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#C77B9B"/><stop offset=".55" stop-color="#F8F0F3"/><stop offset="1" stop-color="#C77B9B"/></linearGradient>
  <pattern id="hero-grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#E5B5C7" stroke-opacity=".06"/></pattern>
</defs>
<style>
.m{font-family:ui-monospace,Consolas,monospace}.s{font-family:Arial,Helvetica,sans-serif}.serif{font-family:Georgia,'Times New Roman',serif}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes dash{to{stroke-dashoffset:-96}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.a{animation:rise .9s ease both}.b{animation:rise .9s .15s ease both}.c{animation:rise .9s .3s ease both}.trace{stroke-dasharray:8 12;animation:dash 8s linear infinite}.pulse{animation:pulse 2.5s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.a,.b,.c,.trace,.pulse{animation:none}}
</style>
<rect width="1200" height="430" rx="22" fill="url(#hero-bg)"/><rect width="1200" height="430" rx="22" fill="url(#hero-glow)"/><rect width="1200" height="430" rx="22" fill="url(#hero-grid)"/><rect x="1" y="1" width="1198" height="428" rx="21" fill="none" stroke="#C77B9B" stroke-opacity=".38"/>
<g class="a"><text class="m" x="48" y="47" fill="#C77B9B" font-size="12" letter-spacing="3">SAMEED KHAN / ENGINEERING PROFILE</text><path d="M48 66H1152" stroke="#451126"/><circle cx="48" cy="66" r="3" fill="#E5B5C7"/></g>
<g class="b"><text class="serif" x="48" y="141" fill="#F8F0F3" font-size="55">Engineering reliable</text><text class="serif" x="48" y="203" fill="url(#hero-metal)" font-size="55" font-style="italic">cloud infrastructure.</text><text class="s" x="50" y="243" fill="#B6A3AC" font-size="19">AWS DevOps · Systems Administration · Networking</text></g>
<g class="c"><text class="m" x="50" y="291" fill="#C77B9B" font-size="12" letter-spacing="2">BUILD</text><text class="m" x="126" y="291" fill="#B6A3AC" font-size="12">INFRASTRUCTURE AS CODE</text><circle cx="325" cy="286" r="3" fill="#C77B9B"/><text class="m" x="344" y="291" fill="#B6A3AC" font-size="12">AUTOMATE</text><circle cx="437" cy="286" r="3" fill="#C77B9B"/><text class="m" x="456" y="291" fill="#B6A3AC" font-size="12">MONITOR</text></g>
<g transform="translate(760 100)">
<rect width="380" height="245" rx="16" fill="#10070C" stroke="#701A3D" stroke-width="1.2"/>
<g transform="translate(22 22)"><circle cx="0" cy="0" r="4" fill="#FB7185"/><circle cx="14" cy="0" r="4" fill="#FBBF24"/><circle cx="28" cy="0" r="4" fill="#34D399"/><text class="m" x="48" y="4" fill="#8F737E" font-size="10">infra/observability</text></g>
<path d="M22 55H358" stroke="#451126"/>
<text class="m" x="22" y="84" fill="#E5B5C7" font-size="12">$ terraform plan</text><text class="m" x="22" y="104" fill="#B6A3AC" font-size="11">+ aws_vpc.network</text><text class="m" x="22" y="122" fill="#B6A3AC" font-size="11">+ aws_instance.monitor</text>
<text class="m" x="22" y="157" fill="#E5B5C7" font-size="12">$ pipeline.run()</text><text class="m" x="22" y="177" fill="#B6A3AC" font-size="11">checkout · build · validate</text>
<text class="m" x="22" y="212" fill="#E5B5C7" font-size="12">$ metrics.observe()</text>
<g transform="translate(215 194)"><path d="M0 16H15L27 0L41 31L55 11L69 18L82 5L99 16L115 16" fill="none" stroke="#C77B9B" stroke-width="2.4"/><circle class="pulse" cx="115" cy="16" r="4" fill="#E5B5C7"/></g>
<path class="trace" d="M0 232H380" fill="none" stroke="#C77B9B" stroke-opacity=".65"/>
</g>
<g class="a"><text class="m" x="48" y="375" fill="#8F737E" font-size="11" letter-spacing="1.7">AWS</text><text class="m" x="112" y="375" fill="#8F737E" font-size="11" letter-spacing="1.7">TERRAFORM</text><text class="m" x="230" y="375" fill="#8F737E" font-size="11" letter-spacing="1.7">JENKINS</text><text class="m" x="321" y="375" fill="#8F737E" font-size="11" letter-spacing="1.7">PROMETHEUS</text><text class="m" x="460" y="375" fill="#8F737E" font-size="11" letter-spacing="1.7">GRAFANA</text><path d="M48 396H1152" stroke="#451126"/><text class="m" x="48" y="415" fill="#8F737E" font-size="10">HANDS-ON LABS · SYSTEMS TROUBLESHOOTING · CONTINUOUS LEARNING</text></g>
</svg>