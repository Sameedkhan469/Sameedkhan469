<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 430" width="1200" height="430" role="img" aria-labelledby="hero-title hero-desc">
<title id="hero-title">Sameed Khan — AWS DevOps, Systems Administration and Networking</title>
<desc id="hero-desc">Profile header for Sameed Khan. The portrait uses the profile photo from the Sameedkhan469 GitHub account. The focus is AWS cloud infrastructure, Terraform, CI/CD and observability.</desc>
<defs>
