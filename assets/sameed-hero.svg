  <radialGradient id="hero-glow" cx="78%" cy="28%" r="75%"><stop stop-color="#701A3D" stop-opacity=".68"/><stop offset="1" stop-color="#10070C" stop-opacity="0"/></radialGradient>
  <linearGradient id="hero-metal" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#C77B9B"/><stop offset=".55" stop-color="#F8F0F3"/><stop offset="1" stop-color="#C77B9B"/></linearGradient>
  <linearGradient id="hero-line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#C77B9B"/><stop offset="1" stop-color="#701A3D" stop-opacity="0"/></linearGradient>
  <pattern id="hero-grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#E5B5C7" stroke-opacity=".055"/></pattern>
