<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="AWS EC2 monitoring project using Terraform, Prometheus, Node Exporter and Grafana">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#190B12"/><stop offset="1" stop-color="#10070C"/></linearGradient><linearGradient id="pink" x1="0" x2="1"><stop stop-color="#C77B9B"/><stop offset="1" stop-color="#E5B5C7"/></linearGradient></defs><style>.m{font-family:ui-monospace,Consolas,monospace}.s{font-family:Arial,Helvetica,sans-serif}.serif{font-family:Georgia,'Times New Roman',serif}@keyframes up{from{opacity:.2;transform:translateY(8px)}to{opacity:1;transform:none}}.ani{animation:up .8s ease both}@media(prefers-reduced-motion:reduce){.ani{animation:none}}</style>
<rect width="1200" height="320" rx="20" fill="url(#bg)" stroke="#C77B9B" stroke-opacity=".32"/><text class="m" x="34" y="35" fill="#C77B9B" font-size="11" letter-spacing="2">PROJECT 01 / OBSERVABILITY</text><text class="serif" x="34" y="78" fill="#F8F0F3" font-size="32">AWS EC2 Monitoring</text><text class="s" x="34" y="107" fill="#B6A3AC" font-size="15">Terraform provisions the lab; Prometheus scrapes Node Exporter;</text><text class="s" x="34" y="129" fill="#B6A3AC" font-size="15">Grafana visualizes CPU, memory, disk and target availability.</text>
<g transform="translate(34 163)"><rect width="270" height="106" rx="12" fill="#10070C" stroke="#451126"/><text class="m" x="18" y="25" fill="#C77B9B" font-size="11">MONITORING EC2</text><path d="M22 67h38l14-22 20 33 16-15h30" stroke="#C77B9B" stroke-width="3" fill="none"/><text class="s" x="18" y="92" fill="#B6A3AC" font-size="12">Prometheus + Grafana</text></g>
<path d="M314 217H350" stroke="#C77B9B" stroke-width="2"/><path d="M342 210l8 7-8 7" fill="none" stroke="#C77B9B" stroke-width="2"/>
<g transform="translate(360 163)"><rect width="250" height="106" rx="12" fill="#10070C" stroke="#451126"/><text class="m" x="18" y="25" fill="#C77B9B" font-size="11">TARGET EC2</text><path d="M18 43h214v34H18z" fill="#190B12" stroke="#701A3D"/><circle cx="34" cy="60" r="4" fill="#E5B5C7"/><path d="M49 60h56m10 0h96" stroke="#8F737E" stroke-width="2"/><text class="s" x="18" y="96" fill="#B6A3AC" font-size="12">Node Exporter · port 9100</text></g>
<g class="ani" transform="translate(650 163)"><rect width="150" height="106" rx="12" fill="#451126" stroke="#C77B9B"/><text class="m" x="16" y="25" fill="#E5B5C7" font-size="11">METRICS</text><text class="serif" x="16" y="53" fill="#F8F0F3" font-size="21">CPU</text><path d="M16 74h22l8-13 10 21 9-15h18l8-10 9 17h26" stroke="#E5B5C7" fill="none" stroke-width="2"/><text class="m" x="16" y="95" fill="#B6A3AC" font-size="9">MEMORY · DISK · UP</text></g>
<text class="m" x="850" y="181" fill="#C77B9B" font-size="12" letter-spacing="1">STACK</text><text class="s" x="850" y="209" fill="#F8F0F3" font-size="16">AWS · VPC · EC2</text><text class="s" x="850" y="235" fill="#F8F0F3" font-size="16">Terraform · Ubuntu</text><text class="s" x="850" y="261" fill="#F8F0F3" font-size="16">Prometheus · Grafana</text><path d="M34 286H1166" stroke="#451126"/><text class="m" x="34" y="306" fill="#8F737E" font-size="11">SERVICES INSTALLED DIRECTLY ON UBUNTU · DOCKER IS NOT USED IN THIS PROJECT</text></svg>