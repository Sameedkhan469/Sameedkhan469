<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Terraform three-tier AWS infrastructure learning project">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#190B12"/><stop offset="1" stop-color="#10070C"/></linearGradient>
  <linearGradient id="fx-sheen" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#E5B5C7" stop-opacity="0"/>
    <stop offset=".48" stop-color="#E5B5C7" stop-opacity=".20"/>
    <stop offset="1" stop-color="#E5B5C7" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="fx-panel-clip"><rect x="0" y="0" width="1200" height="320" rx="20"/></clipPath>
  <filter id="fx-panel-glow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="1.8" result="glow"/>
    <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs><style>.m{font-family:ui-monospace,Consolas,monospace}.s{font-family:Arial,Helvetica,sans-serif}.serif{font-family:Georgia,'Times New Roman',serif}</style>
<rect width="1200" height="320" rx="20" fill="url(#bg)" stroke="#C77B9B" stroke-opacity=".32"/><text class="m" x="34" y="35" fill="#C77B9B" font-size="11" letter-spacing="2">PROJECT 03 / TERRAFORM</text><text class="serif" x="34" y="78" fill="#F8F0F3" font-size="32">AWS Three-Tier Infrastructure</text><text class="s" x="34" y="106" fill="#B6A3AC" font-size="15">A learning architecture with subnet tiers across two Availability Zones.</text>
<g transform="translate(34 135)"><rect width="225" height="106" rx="12" fill="#451126" stroke="#C77B9B"/><text class="m" x="16" y="23" fill="#E5B5C7" font-size="10">PUBLIC TIER</text><text class="serif" x="16" y="52" fill="#F8F0F3" font-size="21">HTTP ALB</text><text class="s" x="16" y="77" fill="#B6A3AC" font-size="12">Two public subnets</text><text class="m" x="16" y="94" fill="#B6A3AC" font-size="10">ENTRY POINT</text></g>
<path d="M268 188H297M289 181l8 7-8 7" stroke="#C77B9B" stroke-width="2" fill="none"/><g transform="translate(306 135)"><rect width="225" height="106" rx="12" fill="#190B12" stroke="#C77B9B"/><text class="m" x="16" y="23" fill="#E5B5C7" font-size="10">FRONTEND</text><text class="serif" x="16" y="52" fill="#F8F0F3" font-size="21">Nginx EC2</text><text class="s" x="16" y="77" fill="#B6A3AC" font-size="12">Two private subnets</text><text class="m" x="16" y="94" fill="#B6A3AC" font-size="10">WEB TIER</text></g>
<path d="M540 188H569M561 181l8 7-8 7" stroke="#C77B9B" stroke-width="2" fill="none"/><g transform="translate(578 135)"><rect width="225" height="106" rx="12" fill="#190B12" stroke="#C77B9B"/><text class="m" x="16" y="23" fill="#E5B5C7" font-size="10">BACKEND</text><text class="serif" x="16" y="52" fill="#F8F0F3" font-size="21">EC2 instances</text><text class="s" x="16" y="77" fill="#B6A3AC" font-size="12">Two private subnets</text><text class="m" x="16" y="94" fill="#B6A3AC" font-size="10">APP TIER</text></g>
<path d="M812 188H841M833 181l8 7-8 7" stroke="#C77B9B" stroke-width="2" fill="none"/><g transform="translate(850 135)"><rect width="316" height="106" rx="12" fill="#190B12" stroke="#C77B9B"/><text class="m" x="16" y="23" fill="#E5B5C7" font-size="10">DATABASE TIER</text><text class="serif" x="16" y="52" fill="#F8F0F3" font-size="21">Private RDS MySQL</text><text class="s" x="16" y="77" fill="#B6A3AC" font-size="12">Two DB subnets</text><text class="m" x="16" y="94" fill="#B6A3AC" font-size="10">DATA TIER</text></g>
<path d="M34 267H1166" stroke="#451126"/><text class="m" x="34" y="289" fill="#C77B9B" font-size="11">VPC 10.0.0.0/16 · 8 SUBNETS · INTERNET GATEWAY · ROUTE TABLES · SECURITY GROUPS</text><text class="s" x="34" y="307" fill="#8F737E" font-size="12">Infrastructure-focused lab; the README notes end-to-end application integration is not complete.</text>
  <style>
    .fx-motion { pointer-events:none; }
    @media (prefers-reduced-motion: reduce) { .fx-motion { display:none; } }
  </style>
  <g class="fx-motion" clip-path="url(#fx-panel-clip)" pointer-events="none">
    <rect x="-280" y="0" width="280" height="320" fill="url(#fx-sheen)" opacity=".62">
      <animate attributeName="x" values="-280;1200;1200" keyTimes="0;.72;1" dur="9.5s" begin="1.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="1.5" y="1.5" width="1197" height="317" rx="19" fill="none" stroke="#C77B9B" stroke-opacity=".54" stroke-width="1.15" stroke-dasharray="58 3040">
      <animate attributeName="stroke-dashoffset" values="0;-3040" dur="24s" repeatCount="indefinite"/>
    </rect>
    <circle r="2.2" fill="#F8F0F3" filter="url(#fx-panel-glow)">
      <animateMotion path="M 20 1 H 1180 Q 1199 1 1199 20 V 300 Q 1199 319 1180 319 H 20 Q 1 319 1 300 V 20 Q 1 1 20 1" dur="17s" begin=".8s" repeatCount="indefinite" rotate="auto"/>
      <animate attributeName="opacity" values=".15;1;.3;1;.15" dur="3.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>