<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 510" width="1200" height="510" role="img" aria-label="Sameed Khan technology toolkit: AWS, Terraform, Jenkins, Maven, Prometheus, Grafana, Splunk, Linux, Windows, Bash, Python, Boto3, networking, Nginx, Flask and MySQL">
<defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#190B12"/><stop offset="1" stop-color="#10070C"/></linearGradient><radialGradient id="glow"><stop stop-color="#451126" stop-opacity=".85"/><stop offset="1" stop-color="#10070C" stop-opacity="0"/></radialGradient></defs><style>.m{font-family:ui-monospace,Consolas,monospace}.s{font-family:Arial,Helvetica,sans-serif}.serif{font-family:Georgia,'Times New Roman',serif}.card{fill:#190B12;stroke:#701A3D;stroke-width:1.2}.tag{fill:#451126;stroke:#C77B9B;stroke-opacity:.6}.label{fill:#E5B5C7;font-size:12px;letter-spacing:1.5px}.item{fill:#F8F0F3;font-size:15px}.sub{fill:#B6A3AC;font-size:12px}</style>
<rect width="1200" height="510" rx="20" fill="url(#bg)" stroke="#C77B9B" stroke-opacity=".28"/><rect width="1200" height="510" rx="20" fill="url(#glow)" opacity=".45"/>
