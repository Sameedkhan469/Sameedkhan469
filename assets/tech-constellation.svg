<g transform="translate(617 28)"><rect class="card" width="555" height="132" rx="14"/><text class="m label" x="20" y="28">02 / BUILD &amp; DELIVERY</text><text class="serif" x="20" y="61" fill="#F8F0F3" font-size="23">Jenkins + Maven + GitHub</text><text class="s item" x="20" y="88">Jenkinsfile · build / test / package</text><text class="s item" x="20" y="112">Webhooks · artifact archiving · Terraform checks</text></g>
<g transform="translate(28 182)"><rect class="card" width="555" height="132" rx="14"/><text class="m label" x="20" y="28">03 / OBSERVABILITY</text><text class="serif" x="20" y="61" fill="#F8F0F3" font-size="23">Prometheus + Grafana + Splunk</text><text class="s item" x="20" y="88">Node Exporter · CPU / memory / disk</text><text class="s item" x="20" y="112">Availability metrics · Linux log forwarding</text></g>
<g transform="translate(617 182)"><rect class="card" width="555" height="132" rx="14"/><text class="m label" x="20" y="28">04 / SYSTEMS &amp; SCRIPTING</text><text class="serif" x="20" y="61" fill="#F8F0F3" font-size="23">Linux + Windows</text><text class="s item" x="20" y="88">systemd · permissions · package management</text><text class="s item" x="20" y="112">Bash · Python · Boto3 · AWS CLI</text></g>
<g transform="translate(28 336)"><rect class="card" width="555" height="132" rx="14"/><text class="m label" x="20" y="28">05 / APPLICATIONS &amp; DATA</text><text class="serif" x="20" y="61" fill="#F8F0F3" font-size="23">Nginx + Flask + MySQL</text><text class="s item" x="20" y="88">Reverse proxy · Python API · relational DB</text><text class="s item" x="20" y="112">EC2 bootstrap · tier-specific security groups</text></g>
