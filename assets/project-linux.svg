<g transform="translate(34 135)"><rect width="1132" height="83" rx="12" fill="#10070C" stroke="#451126"/><text class="m" x="22" y="28" fill="#E5B5C7" font-size="14">$ systemctl status nginx</text><text class="m" x="22" y="51" fill="#B6A3AC" font-size="13">$ ss -tulpn   ·   journalctl -u service   ·   df -h   ·   free -h</text><text class="m" x="22" y="70" fill="#8F737E" font-size="12">FILES · PERMISSIONS · USERS · PROCESSES · NETWORKING · STORAGE · LOGS · SHELL BASICS</text></g><text class="m" x="34" y="242" fill="#C77B9B" font-size="11">REPO: LINUX-COMMANDS</text></svg>