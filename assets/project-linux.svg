<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Linux commands reference">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10162B"/><stop offset="1" stop-color="#090E1F"/></linearGradient>
  <linearGradient id="fx-sheen" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#7DD3FC" stop-opacity="0"/>
    <stop offset=".48" stop-color="#7DD3FC" stop-opacity=".20"/>
    <stop offset="1" stop-color="#7DD3FC" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="fx-panel-clip"><rect x="0" y="0" width="1200" height="260" rx="20"/></clipPath>
  <filter id="fx-panel-glow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="1.8" result="glow"/>
    <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs><style>.m{font-family:ui-monospace,Consolas,monospace}.s{font-family:Arial,Helvetica,sans-serif}.serif{font-family:Georgia,'Times New Roman',serif}</style>
<rect width="1200" height="260" rx="20" fill="url(#bg)" stroke="#60A5FA" stroke-opacity=".32"/><text class="m" x="34" y="35" fill="#60A5FA" font-size="11" letter-spacing="2">PROJECT 06 / SYSTEMS ADMINISTRATION</text><text class="serif" x="34" y="78" fill="#F4F8FF" font-size="31">Linux Commands for DevOps &amp; Cloud</text><text class="s" x="34" y="108" fill="#C4D2E8" font-size="15">A reference covering common system administration and operational commands.</text>
<g transform="translate(34 135)"><rect width="1132" height="83" rx="12" fill="#090E1F" stroke="#1E3A8A"/><text class="m" x="22" y="28" fill="#7DD3FC" font-size="14">$ systemctl status nginx</text><text class="m" x="22" y="51" fill="#C4D2E8" font-size="13">$ ss -tulpn   ·   journalctl -u service   ·   df -h   ·   free -h</text><text class="m" x="22" y="70" fill="#91A4C6" font-size="12">FILES · PERMISSIONS · USERS · PROCESSES · NETWORKING · STORAGE · LOGS · SHELL BASICS</text></g><text class="m" x="34" y="242" fill="#60A5FA" font-size="11">REPO: LINUX-COMMANDS</text>
  <style>
    .fx-motion { pointer-events:none; }
    @media (prefers-reduced-motion: reduce) { .fx-motion { display:none; } }
  </style>
  <g class="fx-motion" clip-path="url(#fx-panel-clip)" pointer-events="none">
    <rect x="-280" y="0" width="280" height="260" fill="url(#fx-sheen)" opacity=".62">
      <animate attributeName="x" values="-280;1200;1200" keyTimes="0;.72;1" dur="9.5s" begin="1.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="1.5" y="1.5" width="1197" height="257" rx="19" fill="none" stroke="#60A5FA" stroke-opacity=".54" stroke-width="1.15" stroke-dasharray="58 2920">
      <animate attributeName="stroke-dashoffset" values="0;-2920" dur="24s" repeatCount="indefinite"/>
    </rect>
    <circle r="2.2" fill="#F4F8FF" filter="url(#fx-panel-glow)">
      <animateMotion path="M 20 1 H 1180 Q 1199 1 1199 20 V 240 Q 1199 259 1180 259 H 20 Q 1 259 1 240 V 20 Q 1 1 20 1" dur="17s" begin=".8s" repeatCount="indefinite" rotate="auto"/>
      <animate attributeName="opacity" values=".15;1;.3;1;.15" dur="3.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>